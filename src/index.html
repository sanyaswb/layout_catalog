<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body class="body">
    <header class="header">
      <a
        href="#home"
        class="logo logo--link"
      >
        <img
          src="../src/images/logo.png"
          alt="logo"
          class="logo__img"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              href="#apple"
              class="nav__link is-active"
            >
              apple
            </a>
          </li>
          <li>
            <a
              href="#samsung"
              class="nav__link"
            >
              samsung
            </a>
          </li>
          <li>
            <a
              href="#smartphones"
              class="nav__link"
            >
              smartphones
            </a>
          </li>
          <li>
            <a
              href="#laptops"
              class="nav__link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li>
            <a
              href="#gadgets"
              class="nav__link"
            >
              gadgets
            </a>
          </li>
          <li>
            <a
              href="#tablets"
              class="nav__link"
            >
              tablets
            </a>
          </li>
          <li>
            <a
              href="#photo"
              class="nav__link"
            >
              photo
            </a>
          </li>
          <li>
            <a
              href="#video"
              class="nav__link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
